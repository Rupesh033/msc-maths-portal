<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.Sc. Mathematics — Semester II Exam Papers Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-main: #f8fafc;
            --header-bg: #1e293b;
            --header-text: #ffffff;
            --border-color: #e2e8f0;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: #1e293b;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Header */
        header {
            background-color: var(--header-bg);
            color: var(--header-text);
            padding: 8px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-badge {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .brand h1 {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.2;
        }

        .brand p {
            font-size: 11px;
            color: #94a3b8;
        }

        /* Interactive Custom Layout & Zero-Gaps Studio Toolbar */
        .layout-controller-bar {
            background: #0f172a;
            color: #fff;
            padding: 7px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #3b82f6;
            flex-wrap: wrap;
            gap: 8px;
            z-index: 20;
        }

        .ctrl-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .ctrl-title {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #93c5fd;
            text-transform: uppercase;
        }

        .lay-toggle {
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            transition: all 0.15s;
        }

        .lay-toggle:hover {
            background: #334155;
            color: #fff;
        }

        .lay-toggle.active {
            background: #2563eb;
            border-color: #3b82f6;
            color: #fff;
            box-shadow: 0 0 8px rgba(37, 99, 235, 0.4);
        }

        /* Stepper Widget (Cols / Font) */
        .stepper-box {
            display: inline-flex;
            align-items: center;
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 5px;
            overflow: hidden;
        }

        .stepper-label {
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            padding: 0 6px;
        }

        .stepper-val {
            font-size: 12px;
            font-weight: 700;
            color: #38bdf8;
            min-width: 24px;
            text-align: center;
        }

        .stepper-btn {
            background: #334155;
            border: none;
            color: #f1f5f9;
            width: 22px;
            height: 24px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stepper-btn:hover {
            background: #2563eb;
        }

        /* Zero Gap Button */
        .btn-zerogap {
            background: #1e293b;
            color: #fbbf24;
            border: 1px solid #d97706;
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 11.5px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-zerogap.active {
            background: #b45309;
            color: #fff;
            border-color: #f59e0b;
            box-shadow: 0 0 6px rgba(245, 158, 11, 0.5);
        }

        .btn-ctrl {
            padding: 5px 12px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s;
            text-decoration: none;
        }

        .btn-print {
            background: #059669;
            color: #fff;
            border-color: #10b981;
        }

        .btn-print:hover {
            background: #047857;
        }

        .btn-download {
            background: #2563eb;
            color: #fff;
            border-color: #3b82f6;
        }

        .btn-download:hover {
            background: #1d4ed8;
        }

        .btn-tab {
            background: #334155;
            color: #f1f5f9;
            border-color: #475569;
        }

        .btn-tab:hover {
            background: #475569;
            color: #fff;
        }

        .dropdown-wrapper {
            position: relative;
        }

        .download-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: 4px;
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 6px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.35);
            min-width: 220px;
            z-index: 100;
            overflow: hidden;
        }

        .download-dropdown.show {
            display: block;
        }

        .download-dropdown a {
            display: block;
            padding: 8px 14px;
            color: #e2e8f0;
            font-size: 12px;
            font-weight: 500;
            text-decoration: none;
            border-bottom: 1px solid #334155;
            transition: background 0.15s;
        }

        .download-dropdown a:last-child {
            border-bottom: none;
        }

        .download-dropdown a:hover {
            background: #2563eb;
            color: #fff;
        }

        /* Tab Navigation Bar */
        .tab-bar {
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 8px;
            overflow-x: auto;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 10px 16px;
            font-size: 13.5px;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 7px;
            white-space: nowrap;
        }

        .tab-btn:hover {
            color: var(--primary);
            background: #f1f5f9;
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            background: #eff6ff;
        }

        .tab-pill {
            background: #e2e8f0;
            color: #475569;
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 12px;
            font-weight: 500;
        }

        .tab-btn.active .tab-pill {
            background: #bfdbfe;
            color: #1e40af;
        }

        /* Content Area */
        .main-container {
            flex: 1;
            position: relative;
            background: #cbd5e1;
            display: flex;
            overflow: hidden;
        }

        .iframe-view {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
            background: #fff;
        }

        .iframe-view.active {
            display: block;
        }

        /* Split / Multi View */
        .multi-view-container {
            display: none;
            width: 100%;
            height: 100%;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 4px;
            background: #94a3b8;
        }

        .multi-view-container.active {
            display: grid;
        }

        .multi-col {
            display: flex;
            flex-direction: column;
            background: #fff;
            height: 100%;
            overflow: hidden;
        }

        .multi-header {
            background: #0f172a;
            color: white;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .multi-header a {
            color: #93c5fd;
            text-decoration: none;
            font-size: 11px;
        }

        .multi-header a:hover {
            text-decoration: underline;
        }

        .multi-iframe {
            flex: 1;
            width: 100%;
            border: none;
        }

        @media (max-width: 900px) {
            .multi-view-container {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <div class="brand">
            <span class="brand-badge">NPU PG MATHS</span>
            <div>
                <h1>M.Sc. Semester II — Exam Papers Portal</h1>
                <p>Nilamber-Pitamber University &bull; Session 2025–2027</p>
            </div>
        </div>

        <div>
            <button class="btn-ctrl btn-tab" onclick="switchTab('multi')" title="View all 3 papers together side-by-side">
                📑 Split View (All 3 Papers)
            </button>
        </div>
    </header>

    <!-- Interactive Custom Layout & Zero-Gaps Studio Toolbar -->
    <div class="layout-controller-bar">
        <!-- Preset Buttons -->
        <div class="ctrl-group">
            <span class="ctrl-title">LAYOUT:</span>
            <button class="lay-toggle active" id="btn-preset-1" onclick="selectPreset('1')" title="1 in 1: Normal book reading">
                📄 1-in-1
            </button>
            <button class="lay-toggle" id="btn-preset-2" onclick="selectPreset('2')" title="2 in 1: Dual columns">
                📑 2-in-1
            </button>
            <button class="lay-toggle" id="btn-preset-3" onclick="selectPreset('3')" title="3 in 1: 3 dense columns">
                📑 3-in-1
            </button>
            <button class="lay-toggle" id="btn-preset-4" onclick="selectPreset('4')" title="4 in 1: 4 columns compact">
                📑 4-in-1
            </button>
            <button class="lay-toggle" id="btn-preset-6" onclick="selectPreset('6')" title="6 in 1: 6 columns pocket notes">
                📑 6-in-1
            </button>
        </div>

        <!-- Custom Columns Stepper -->
        <div class="ctrl-group">
            <div class="stepper-box">
                <span class="stepper-label">Cols:</span>
                <button class="stepper-btn" onclick="adjustCols(-1)" title="Decrease columns">&minus;</button>
                <span class="stepper-val" id="lbl-cols">1</span>
                <button class="stepper-btn" onclick="adjustCols(1)" title="Increase columns">+</button>
            </div>

            <!-- Font Size Stepper -->
            <div class="stepper-box">
                <span class="stepper-label">Font:</span>
                <button class="stepper-btn" onclick="adjustFont(-1)" title="Smaller text">&minus;</button>
                <span class="stepper-val" id="lbl-font">14.5</span>
                <button class="stepper-btn" onclick="adjustFont(1)" title="Larger text">+</button>
            </div>

            <!-- Zero Gap Toggle Button -->
            <button class="btn-zerogap active" id="btn-zerogap" onclick="toggleZeroGap()" title="Toggle Zero-Gaps continuous mode (eliminates all empty space)">
                🚫 Zero Gaps: ON
            </button>

            <!-- Orientation Toggle -->
            <button class="lay-toggle" id="btn-orient" onclick="toggleOrientation()" title="Switch page orientation">
                📄 Portrait
            </button>
        </div>

        <!-- Action Buttons -->
        <div class="ctrl-group">
            <button class="btn-ctrl btn-print" onclick="printCurrentPaper()" title="Print currently active paper with selected layout">
                🖨️ Print View
            </button>
            <div class="dropdown-wrapper">
                <button class="btn-ctrl btn-download" onclick="toggleDownloadMenu()" title="Download PDF of active paper">
                    📥 Download PDF ▾
                </button>
                <div id="download-dropdown" class="download-dropdown">
                    <a href="javascript:void(0)" onclick="downloadPaperPDF('6in1')">📑 6-in-1 PDF (Pocket Print)</a>
                    <a href="javascript:void(0)" onclick="downloadPaperPDF('4in1')">📑 4-in-1 PDF (Compact Grid)</a>
                    <a href="javascript:void(0)" onclick="downloadPaperPDF('compact')">📄 1-in-1 Full Paper PDF</a>
                </div>
            </div>
            <button class="btn-ctrl btn-tab" onclick="openCurrentInNewTab()" title="Open active paper in separate browser tab">
                ↗ Separate Tab
            </button>
        </div>
    </div>

    <!-- Tab Bar -->
    <nav class="tab-bar">
        <button class="tab-btn active" id="tab-btn-cc204" onclick="switchTab('cc204')">
            📄 CC-204
            <span class="tab-pill">ODE (Maths)</span>
        </button>
        <button class="tab-btn" id="tab-btn-cc205" onclick="switchTab('cc205')">
            📄 CC-205
            <span class="tab-pill">Diff Geometry & Tensors</span>
        </button>
        <button class="tab-btn" id="tab-btn-ec201" onclick="switchTab('ec201')">
            💻 EC-201
            <span class="tab-pill">C & MATLAB</span>
        </button>
        <button class="tab-btn" id="tab-btn-multi" onclick="switchTab('multi')">
            🗂️ Split View (All 3 Together)
        </button>
    </nav>

    <!-- Main Workspace -->
    <main class="main-container">
        <!-- Tab 1: CC-204 -->
        <iframe id="iframe-cc204" class="iframe-view active" src="paper cc-204.html"></iframe>

        <!-- Tab 2: CC-205 -->
        <iframe id="iframe-cc205" class="iframe-view" src="cc-205.html"></iframe>

        <!-- Tab 3: EC-201 -->
        <iframe id="iframe-ec201" class="iframe-view" src="ec201.html"></iframe>

        <!-- Tab 4: Side-by-Side Multi View -->
        <div id="multi-view" class="multi-view-container">
            <div class="multi-col">
                <div class="multi-header">
                    <span>CC-204: ODE</span>
                    <a href="paper cc-204.html" target="_blank">Full Page ↗</a>
                </div>
                <iframe class="multi-iframe" src="paper cc-204.html"></iframe>
            </div>
            <div class="multi-col">
                <div class="multi-header">
                    <span>CC-205: Diff Geometry</span>
                    <a href="cc-205.html" target="_blank">Full Page ↗</a>
                </div>
                <iframe class="multi-iframe" src="cc-205.html"></iframe>
            </div>
            <div class="multi-col">
                <div class="multi-header">
                    <span>EC-201: C & MATLAB</span>
                    <a href="ec201.html" target="_blank">Full Page ↗</a>
                </div>
                <iframe class="multi-iframe" src="ec201.html"></iframe>
            </div>
        </div>
    </main>

    <script>
        let currentActive = 'cc204';

        let currentConfig = {
            preset: '1',
            columns: 1,
            fontSize: 14.5,
            zeroGap: true,
            orientation: 'portrait',
            pageMargin: '4mm'
        };

        const fileMap = {
            'cc204': 'paper cc-204.html',
            'cc205': 'cc-205.html',
            'ec201': 'ec201.html'
        };

        function switchTab(tabId) {
            currentActive = tabId;

            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById('tab-btn-' + tabId);
            if (activeBtn) activeBtn.classList.add('active');

            document.querySelectorAll('.iframe-view').forEach(frame => frame.classList.remove('active'));
            const multiView = document.getElementById('multi-view');
            multiView.classList.remove('active');

            if (tabId === 'multi') {
                multiView.classList.add('active');
            } else {
                const targetFrame = document.getElementById('iframe-' + tabId);
                if (targetFrame) {
                    targetFrame.classList.add('active');
                    applyConfig();
                }
            }
        }

        function applyConfig() {
            // Update labels
            document.getElementById('lbl-cols').innerText = currentConfig.columns;
            document.getElementById('lbl-font').innerText = currentConfig.fontSize;
            
            // Update Zero Gap Button
            const zgBtn = document.getElementById('btn-zerogap');
            if (zgBtn) {
                if (currentConfig.zeroGap) {
                    zgBtn.classList.add('active');
                    zgBtn.innerText = '🚫 Zero Gaps: ON';
                } else {
                    zgBtn.classList.remove('active');
                    zgBtn.innerText = '📏 Zero Gaps: OFF';
                }
            }

            // Update Orientation Button
            const orBtn = document.getElementById('btn-orient');
            if (orBtn) {
                orBtn.innerText = (currentConfig.orientation === 'portrait') ? '📄 Portrait' : '📃 Landscape';
            }

            // Update Presets
            document.querySelectorAll('.lay-toggle').forEach(b => {
                if (b.id && b.id.startsWith('btn-preset-')) b.classList.remove('active');
            });
            const pBtn = document.getElementById('btn-preset-' + currentConfig.preset);
            if (pBtn) pBtn.classList.add('active');

            // Send config to all active iframes
            ['iframe-cc204', 'iframe-cc205', 'iframe-ec201'].forEach(id => {
                const frame = document.getElementById(id);
                if (frame && frame.contentWindow) {
                    frame.contentWindow.postMessage({
                        type: 'APPLY_CUSTOM_CONFIG',
                        config: currentConfig
                    }, '*');
                }
            });
        }

        function selectPreset(num) {
            currentConfig.preset = num;
            if (num === '1') {
                currentConfig.columns = 1;
                currentConfig.fontSize = 14.5;
                currentConfig.zeroGap = false;
                currentConfig.orientation = 'portrait';
            } else if (num === '2') {
                currentConfig.columns = 2;
                currentConfig.fontSize = 12;
                currentConfig.zeroGap = true;
                currentConfig.orientation = 'portrait';
            } else if (num === '3') {
                currentConfig.columns = 3;
                currentConfig.fontSize = 10.5;
                currentConfig.zeroGap = true;
                currentConfig.orientation = 'landscape';
            } else if (num === '4') {
                currentConfig.columns = 4;
                currentConfig.fontSize = 9.5;
                currentConfig.zeroGap = true;
                currentConfig.orientation = 'landscape';
            } else if (num === '6') {
                currentConfig.columns = 6;
                currentConfig.fontSize = 8.5;
                currentConfig.zeroGap = true;
                currentConfig.orientation = 'landscape';
            }
            applyConfig();
        }

        function adjustCols(delta) {
            currentConfig.preset = 'custom';
            currentConfig.columns = Math.max(1, Math.min(6, currentConfig.columns + delta));
            applyConfig();
        }

        function adjustFont(delta) {
            currentConfig.preset = 'custom';
            currentConfig.fontSize = Math.round((currentConfig.fontSize + delta) * 10) / 10;
            currentConfig.fontSize = Math.max(7, Math.min(18, currentConfig.fontSize));
            applyConfig();
        }

        function toggleZeroGap() {
            currentConfig.zeroGap = !currentConfig.zeroGap;
            applyConfig();
        }

        function toggleOrientation() {
            currentConfig.orientation = (currentConfig.orientation === 'portrait') ? 'landscape' : 'portrait';
            applyConfig();
        }

        function toggleDownloadMenu() {
            const drop = document.getElementById('download-dropdown');
            if (drop) drop.classList.toggle('show');
        }

        window.onclick = function(e) {
            if (!e.target.closest('.dropdown-wrapper')) {
                const drop = document.getElementById('download-dropdown');
                if (drop && drop.classList.contains('show')) {
                    drop.classList.remove('show');
                }
            }
        };

        function downloadPaperPDF(type) {
            const map = {
                'cc204': { '6in1': 'cc204_6in1.pdf', '4in1': 'cc204_4in1.pdf', 'compact': 'cc204_base_compact.pdf' },
                'cc205': { '6in1': 'cc205_6in1.pdf', '4in1': 'cc205_4in1.pdf', 'compact': 'cc205_base_compact.pdf' },
                'ec201': { '6in1': 'ec201_6in1.pdf', '4in1': 'ec201_4in1.pdf', 'compact': 'ec201_base_compact.pdf' }
            };
            const paper = (currentActive === 'multi') ? 'ec201' : currentActive;
            const targetPdf = (map[paper] && map[paper][type]) || 'ec201_6in1.pdf';
            window.open(targetPdf, '_blank');
            const drop = document.getElementById('download-dropdown');
            if (drop) drop.classList.remove('show');
        }

        function openCurrentInNewTab() {
            if (currentActive === 'multi') {
                window.open('paper cc-204.html', '_blank');
                window.open('cc-205.html', '_blank');
                window.open('ec201.html', '_blank');
            } else {
                const url = fileMap[currentActive];
                if (url) window.open(url, '_blank');
            }
        }

        function printCurrentPaper() {
            if (currentActive === 'multi') {
                alert('Please select a specific paper tab (CC-204, CC-205, or EC-201) to print.');
                return;
            }
            const iframe = document.getElementById('iframe-' + currentActive);
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.focus();
                iframe.contentWindow.print();
            }
        }

        // Apply initial config on load
        window.addEventListener('load', function() {
            setTimeout(applyConfig, 500);
        });
    </script>
</body>

</html>
