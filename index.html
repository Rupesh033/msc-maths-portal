<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.Sc. Mathematics — Semester II Exam Papers Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-main: #f8fafc;
            --header-bg: #1e293b;
            --header-text: #ffffff;
            --border-color: #e2e8f0;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: #1e293b;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Header */
        header {
            background-color: var(--header-bg);
            color: var(--header-text);
            padding: 8px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-badge {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .brand h1 {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.2;
        }

        .brand p {
            font-size: 11px;
            color: #94a3b8;
        }

        /* Clean Layout Controller Bar */
        .layout-controller-bar {
            background: #0f172a;
            color: #fff;
            padding: 7px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #3b82f6;
            flex-wrap: wrap;
            gap: 8px;
            z-index: 20;
        }

        .ctrl-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .ctrl-title {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #93c5fd;
            text-transform: uppercase;
        }

        .lay-toggle {
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 5px 11px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.15s;
        }

        .lay-toggle:hover {
            background: #334155;
            color: #fff;
        }

        .lay-toggle.active {
            background: #2563eb;
            border-color: #3b82f6;
            color: #fff;
            box-shadow: 0 0 8px rgba(37, 99, 235, 0.4);
        }

        .btn-ctrl {
            padding: 5px 12px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s;
            text-decoration: none;
        }

        .btn-print {
            background: #059669;
            color: #fff;
            border-color: #10b981;
        }

        .btn-print:hover {
            background: #047857;
        }

        .btn-download {
            background: #2563eb;
            color: #fff;
            border-color: #3b82f6;
        }

        .btn-download:hover {
            background: #1d4ed8;
        }

        .btn-tab {
            background: #334155;
            color: #f1f5f9;
            border-color: #475569;
        }

        .btn-tab:hover {
            background: #475569;
            color: #fff;
        }

        .dropdown-wrapper {
            position: relative;
        }

        .download-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: 4px;
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 6px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.35);
            min-width: 230px;
            z-index: 100;
            overflow: hidden;
        }

        .download-dropdown.show {
            display: block;
        }

        .download-dropdown a {
            display: block;
            padding: 8px 14px;
            color: #e2e8f0;
            font-size: 12px;
            font-weight: 500;
            text-decoration: none;
            border-bottom: 1px solid #334155;
            transition: background 0.15s;
        }

        .download-dropdown a:last-child {
            border-bottom: none;
        }

        .download-dropdown a:hover {
            background: #2563eb;
            color: #fff;
        }

        /* Tab Navigation Bar */
        .tab-bar {
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 8px;
            overflow-x: auto;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 10px 16px;
            font-size: 13.5px;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 7px;
            white-space: nowrap;
        }

        .tab-btn:hover {
            color: var(--primary);
            background: #f1f5f9;
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            background: #eff6ff;
        }

        .tab-pill {
            background: #e2e8f0;
            color: #475569;
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 12px;
            font-weight: 500;
        }

        .tab-btn.active .tab-pill {
            background: #bfdbfe;
            color: #1e40af;
        }

        /* Content Area */
        .main-container {
            flex: 1;
            position: relative;
            background: #cbd5e1;
            display: flex;
            overflow: hidden;
        }

        .iframe-view {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
            background: #fff;
        }

        .iframe-view.active {
            display: block;
        }

        /* Split / Dual Multi View */
        .multi-view-container {
            display: none;
            width: 100%;
            height: 100%;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            background: #94a3b8;
        }

        .multi-view-container.active {
            display: grid;
        }

        .multi-col {
            display: flex;
            flex-direction: column;
            background: #fff;
            height: 100%;
            overflow: hidden;
        }

        .multi-header {
            background: #0f172a;
            color: white;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .multi-header a {
            color: #93c5fd;
            text-decoration: none;
            font-size: 11px;
        }

        .multi-header a:hover {
            text-decoration: underline;
        }

        .multi-iframe {
            flex: 1;
            width: 100%;
            border: none;
        }

        @media (max-width: 900px) {
            .multi-view-container {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <div class="brand">
            <span class="brand-badge">NPU PG MATHS</span>
            <div>
                <h1>M.Sc. Semester II — Exam Papers Portal</h1>
                <p>Nilamber-Pitamber University &bull; Session 2025–2027</p>
            </div>
        </div>

        <div>
            <button class="btn-ctrl btn-tab" onclick="switchTab('multi')" title="View both papers side-by-side">
                📑 Split View (Both Papers)
            </button>
        </div>
    </header>

    <!-- Clean, Powerful Layout & Print Controller Bar -->
    <div class="layout-controller-bar">
        <!-- Preset Buttons (1, 2, 4, 6, 9 in 1) -->
        <div class="ctrl-group">
            <span class="ctrl-title">LAYOUT:</span>
            <button class="lay-toggle active" id="btn-preset-1" onclick="selectPreset('1')" title="1 in 1: Continuous full page reading">
                📄 1-in-1
            </button>
            <button class="lay-toggle" id="btn-preset-2" onclick="selectPreset('2')" title="2 in 1: Dual continuous columns">
                📑 2-in-1
            </button>
            <button class="lay-toggle" id="btn-preset-4" onclick="selectPreset('4')" title="4 in 1: 4-up compact layout">
                📑 4-in-1
            </button>
            <button class="lay-toggle" id="btn-preset-6" onclick="selectPreset('6')" title="6 in 1: 6-up pocket notes">
                📑 6-in-1
            </button>
            <button class="lay-toggle" id="btn-preset-9" onclick="selectPreset('9')" title="9 in 1: 9-up ultra pocket notes">
                📑 9-in-1
            </button>
        </div>

        <!-- Action Buttons -->
        <div class="ctrl-group">
            <button class="btn-ctrl btn-print" onclick="printCurrentPaper()" title="Print currently active paper with selected layout">
                🖨️ Print View
            </button>
            <div class="dropdown-wrapper">
                <button class="btn-ctrl btn-download" onclick="toggleDownloadMenu()" title="Download PDF of active paper">
                    📥 Download PDF ▾
                </button>
                <div id="download-dropdown" class="download-dropdown">
                    <a href="javascript:void(0)" onclick="downloadPaperPDF('9in1')">📑 9-in-1 PDF (Ultra Pocket)</a>
                    <a href="javascript:void(0)" onclick="downloadPaperPDF('6in1')">📑 6-in-1 PDF (Pocket Print)</a>
                    <a href="javascript:void(0)" onclick="downloadPaperPDF('4in1')">📑 4-in-1 PDF (Compact Grid)</a>
                    <a href="javascript:void(0)" onclick="downloadPaperPDF('1in1')">📄 1-in-1 Full Paper PDF</a>
                </div>
            </div>
            <button class="btn-ctrl btn-tab" onclick="openCurrentInNewTab()" title="Open active paper in separate browser tab">
                ↗ Separate Tab
            </button>
        </div>
    </div>

    <!-- Tab Bar -->
    <nav class="tab-bar">
        <button class="tab-btn active" id="tab-btn-cc204" onclick="switchTab('cc204')">
            📄 CC-204
            <span class="tab-pill">ODE (Maths)</span>
        </button>
        <button class="tab-btn" id="tab-btn-cc205" onclick="switchTab('cc205')">
            📄 CC-205
            <span class="tab-pill">Diff Geometry & Tensors</span>
        </button>
        <button class="tab-btn" id="tab-btn-multi" onclick="switchTab('multi')">
            🗂️ Split View (Both Together)
        </button>
    </nav>

    <!-- Main Workspace -->
    <main class="main-container">
        <!-- Tab 1: CC-204 -->
        <iframe id="iframe-cc204" class="iframe-view active" src="cc-204.html"></iframe>

        <!-- Tab 2: CC-205 -->
        <iframe id="iframe-cc205" class="iframe-view" src="cc-205.html"></iframe>

        <!-- Tab 3: Side-by-Side Multi View -->
        <div id="multi-view" class="multi-view-container">
            <div class="multi-col">
                <div class="multi-header">
                    <span>CC-204: ODE</span>
                    <a href="cc-204.html" target="_blank">Full Page ↗</a>
                </div>
                <iframe class="multi-iframe" src="cc-204.html"></iframe>
            </div>
            <div class="multi-col">
                <div class="multi-header">
                    <span>CC-205: Diff Geometry</span>
                    <a href="cc-205.html" target="_blank">Full Page ↗</a>
                </div>
                <iframe class="multi-iframe" src="cc-205.html"></iframe>
            </div>
        </div>
    </main>

    <script>
        let currentActive = 'cc204';
        let currentLayout = '1';

        const fileMap = {
            'cc204': 'cc-204.html',
            'cc205': 'cc-205.html'
        };

        function switchTab(tabId) {
            currentActive = tabId;

            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById('tab-btn-' + tabId);
            if (activeBtn) activeBtn.classList.add('active');

            document.querySelectorAll('.iframe-view').forEach(frame => frame.classList.remove('active'));
            const multiView = document.getElementById('multi-view');
            multiView.classList.remove('active');

            if (tabId === 'multi') {
                multiView.classList.add('active');
            } else {
                const targetFrame = document.getElementById('iframe-' + tabId);
                if (targetFrame) {
                    targetFrame.classList.add('active');
                    // Sync layout to iframe
                    if (targetFrame.contentWindow) {
                        targetFrame.contentWindow.postMessage({ type: 'SET_LAYOUT', mode: currentLayout }, '*');
                    }
                }
            }
        }

        function selectPreset(num) {
            currentLayout = num;

            document.querySelectorAll('.lay-toggle').forEach(b => {
                if (b.id && b.id.startsWith('btn-preset-')) b.classList.remove('active');
            });
            const pBtn = document.getElementById('btn-preset-' + num);
            if (pBtn) pBtn.classList.add('active');

            // Send layout message to all iframes
            document.querySelectorAll('iframe').forEach(frame => {
                try {
                    if (frame.contentWindow) {
                        frame.contentWindow.postMessage({
                            type: 'SET_LAYOUT',
                            mode: num
                        }, '*');
                    }
                } catch(e) {}
            });
        }

        // Auto sync layout when any iframe loads
        window.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('iframe').forEach(frame => {
                frame.addEventListener('load', function() {
                    try {
                        if (frame.contentWindow) {
                            frame.contentWindow.postMessage({ type: 'SET_LAYOUT', mode: currentLayout }, '*');
                        }
                    } catch(e) {}
                });
            });
        });

        function toggleDownloadMenu() {
            const drop = document.getElementById('download-dropdown');
            if (drop) drop.classList.toggle('show');
        }

        window.onclick = function(e) {
            if (!e.target.closest('.dropdown-wrapper')) {
                const drop = document.getElementById('download-dropdown');
                if (drop && drop.classList.contains('show')) {
                    drop.classList.remove('show');
                }
            }
        };

        function downloadPaperPDF(type) {
            const map = {
                'cc204': { '9in1': 'cc204_9in1.pdf', '6in1': 'cc204_6in1.pdf', '4in1': 'cc204_4in1.pdf', '1in1': 'cc204_1in1.pdf' },
                'cc205': { '9in1': 'cc205_9in1.pdf', '6in1': 'cc205_6in1.pdf', '4in1': 'cc205_4in1.pdf', '1in1': 'cc205_1in1.pdf' }
            };
            const paper = (currentActive === 'multi') ? 'cc204' : currentActive;
            const targetPdf = (map[paper] && map[paper][type]) || 'cc204_9in1.pdf';
            window.open(targetPdf, '_blank');
            const drop = document.getElementById('download-dropdown');
            if (drop) drop.classList.remove('show');
        }

        function openCurrentInNewTab() {
            if (currentActive === 'multi') {
                window.open('cc-204.html', '_blank');
                window.open('cc-205.html', '_blank');
            } else {
                const url = fileMap[currentActive];
                if (url) window.open(url, '_blank');
            }
        }

        function printCurrentPaper() {
            if (currentActive === 'multi') {
                alert('Please select CC-204 or CC-205 tab to print.');
                return;
            }
            const iframe = document.getElementById('iframe-' + currentActive);
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage({ type: 'SET_LAYOUT', mode: currentLayout }, '*');
                setTimeout(function() {
                    iframe.contentWindow.focus();
                    iframe.contentWindow.print();
                }, 150);
            }
        }
    </script>
</body>

</html>
